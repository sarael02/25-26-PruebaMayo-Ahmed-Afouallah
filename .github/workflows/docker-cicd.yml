name: Docker CI/CD

on:
  push:
    branches: [ main ]
    paths:
      - app/**
  pull_request:
    branches: [ main ]
    paths:
      - app/**

concurrency:
  group: ec2-deploy-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build-and-push:
    name: Build and Push Docker image
    runs-on: ubuntu-latest
    
    steps:
      # 1. Checkout code
      - uses: actions/checkout@v4
      
      # 2. Login to DockerHub
      - name: Login to DockerHub
        uses: docker/login-action@v3 
        with:
          username: ${{ secrets.DHUB_USER }}
          password: ${{ secrets.DHUB_TOKEN }}
      
      # 3. Build and push Docker image
      - name: Build and push Docker image
        uses: docker/build-push-action@v5
        with:
          context: .
          push: ${{ github.event_name == 'push' }}
          tags: |
            ${{ secrets.DHUB_USER }}/${{ secrets.DOCKER_APP_NAME }}:latest
            ${{ secrets.DHUB_USER }}/${{ secrets.DOCKER_APP_NAME }}:${{ github.sha }}
      
      # 4. Copy docker-compose.yml via SCP
      - name: Copy docker-compose to AWS
        if: github.event_name == 'push'
        uses: appleboy/scp-action@v0.1.7
        with:
          host: ${{ secrets.EC2_IP }}
          username: ${{ secrets.EC2_USER }}
          port: 22
          key: ${{ secrets.EC2_KEY }}
          source: "docker-compose.yml"
          target: "/home/${{ secrets.EC2_USER }}/"
          strip_components: 0
      
      # 5. Deploy Docker services on AWS (push only)
      - name: Deploy to AWS EC2
        if: github.event_name == 'push'
        uses: appleboy/ssh-action@v1.0.3
        with:
          host: ${{ secrets.EC2_IP }}
          username: ${{ secrets.EC2_USER }}
          key: ${{ secrets.EC2_KEY }}
          port: 22
          script: |
            # Login to DockerHub on EC2
            echo "${{ secrets.DHUB_TOKEN }}" | docker login -u "${{ secrets.DHUB_USER }}" --password-stdin
            
            # Navigate to the directory
            cd /home/${{ secrets.EC2_USER }}
            
            # Recreate stack from the latest image in a single flow
            docker compose down --remove-orphans
            docker compose pull
            docker compose up -d --remove-orphans
            
            # Show running containers (for debugging)
            docker ps
